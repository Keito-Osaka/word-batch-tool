name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies and build backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

          Push-Location python
          try {
            python -m PyInstaller --clean --noconfirm bridge.spec
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path -LiteralPath "python/dist/word-batch-backend")) {
            Write-Host "PyInstaller output:"
            if (Test-Path -LiteralPath "python/dist") {
              Get-ChildItem "python/dist" -Recurse | Select-Object FullName, Length
            }
            throw "PyInstaller did not create python/dist/word-batch-backend."
          }

          New-Item -ItemType Directory -Force `
            -Path "src-tauri/resources/backend" | Out-Null

          Copy-Item `
            "python/dist/word-batch-backend/*" `
            "src-tauri/resources/backend/" `
            -Recurse `
            -Force

      - name: Smoke test Python backend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $backendExe = Get-ChildItem `
            "src-tauri/resources/backend" `
            -Recurse `
            -File `
            -Filter "word-batch-backend.exe" |
            Select-Object -First 1

          if (-not $backendExe) {
            throw "word-batch-backend.exe was not found after staging."
          }

          $warmupInput = '{"command":"warmup"}'
          $warmupOutput = $warmupInput | & $backendExe.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Python backend warmup failed with exit code $LASTEXITCODE."
          }

          if (-not $warmupOutput) {
            throw "Python backend warmup returned no output."
          }

          Write-Host "Python backend: $($backendExe.FullName)"
          Write-Host $warmupOutput

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            native-host -> target

      - name: Build Native Messaging bridge
        working-directory: native-host
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Native Messaging bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "native-host/target/x86_64-pc-windows-msvc/release/word-batch-native-host.exe"
          $destination = "src-tauri/resources/native-messaging/word-batch-native-host.exe"

          if (-not (Test-Path -LiteralPath $source)) {
            Write-Host "Native Messaging build output:"
            if (Test-Path -LiteralPath "native-host/target") {
              Get-ChildItem "native-host/target" -Recurse -File |
                Select-Object FullName, Length
            }
            throw "Native Messaging executable was not created: $source"
          }

          New-Item -ItemType Directory -Force `
            -Path "src-tauri/resources/native-messaging" | Out-Null

          Copy-Item $source $destination -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Generate Windows icon set
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -LiteralPath "src-tauri/icons/icon.png")) {
            throw "src-tauri/icons/icon.png was not found."
          }

          npm run tauri icon "src-tauri/icons/icon.png"

      - name: Verify integrated Tauri resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $backendExe = Get-ChildItem `
            "src-tauri/resources/backend" `
            -Recurse `
            -File `
            -Filter "word-batch-backend.exe" |
            Select-Object -First 1

          if (-not $backendExe) {
            Write-Host "Python distribution output:"
            if (Test-Path -LiteralPath "python/dist") {
              Get-ChildItem "python/dist" -Recurse |
                Select-Object FullName, Length
            }
            throw "Required integrated resource is missing: word-batch-backend.exe"
          }

          $required = @(
            "src-tauri/resources/native-messaging/word-batch-native-host.exe",
            "src-tauri/resources/edge-extension/manifest.json",
            "src-tauri/resources/edge-extension/background.js",
            "src-tauri/resources/edge-extension/content.js"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Required integrated resource is missing: $path"
            }
          }

          $manifest = Get-Content `
            "src-tauri/resources/edge-extension/manifest.json" `
            -Raw |
            ConvertFrom-Json

          if (-not $manifest.key) {
            throw "The fixed-ID key is missing from the Edge extension manifest."
          }

          Write-Host "Backend executable: $($backendExe.FullName)"
          Write-Host "Native Messaging executable: src-tauri/resources/native-messaging/word-batch-native-host.exe"
          Write-Host "Edge extension version: $($manifest.version)"

          Get-ChildItem "src-tauri/resources" -Recurse |
            Select-Object FullName, Length

      - name: Build frontend
        shell: pwsh
        run: npm run build

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Verify installer output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installers = Get-ChildItem `
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" `
            -File `
            -Filter "*-setup.exe" `
            -ErrorAction SilentlyContinue

          if (-not $installers) {
            Write-Host "Tauri bundle output:"
            if (Test-Path -LiteralPath "src-tauri/target") {
              Get-ChildItem "src-tauri/target" -Recurse -File |
                Where-Object { $_.Extension -in ".exe", ".msi" } |
                Select-Object FullName, Length
            }
            throw "The NSIS installer was not created."
          }

          $installers | Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WordBatchTool-Windows-v3.0.0
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
