name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Build Python backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          Push-Location python
          python -m PyInstaller --clean --noconfirm bridge.spec
          Pop-Location
          New-Item -ItemType Directory -Force src-tauri/resources/backend | Out-Null
          Copy-Item python/dist/word-batch-backend/* src-tauri/resources/backend/ -Recurse -Force
      - name: Smoke test Python backend
        shell: pwsh
        run: |
          $warmup = '{}' | & "src-tauri/resources/backend/word-batch-backend.exe" warmup
          if ($LASTEXITCODE -ne 0) { throw "Python backend warmup failed." }
          $warmupResult = $warmup | ConvertFrom-Json
          if (-not $warmupResult.success) { throw "Python backend warmup returned an invalid response." }
          $request = @{ data_path = (Resolve-Path "test-data/テスト用置換データ.xlsx").Path; format_amount_with_comma = $true; row_exclude_mode = "selected_column_number_empty"; row_exclude_target_column_number = 2 } | ConvertTo-Json -Compress
          $output = $request | & "src-tauri/resources/backend/word-batch-backend.exe" inspect
          if ($LASTEXITCODE -ne 0) { throw "Python backend smoke test failed." }
          $result = $output | ConvertFrom-Json
          if ($result.included_count -ne 10) { throw "Unexpected included_count: $($result.included_count)" }
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: WordBatchTool-Windows-v0.5
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
