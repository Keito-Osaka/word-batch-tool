name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Build Python backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          Push-Location python
          python -m PyInstaller --clean --noconfirm bridge.spec
          Pop-Location
          New-Item -ItemType Directory -Force src-tauri/resources/backend | Out-Null
          Copy-Item python/dist/word-batch-backend/* src-tauri/resources/backend/ -Recurse -Force
      - name: Smoke test Python backend
        shell: pwsh
        run: |
          $warmup = '{}' | & "src-tauri/resources/backend/word-batch-backend.exe" warmup
          if ($LASTEXITCODE -ne 0) { throw "Python backend warmup failed." }
          $warmupResult = $warmup | ConvertFrom-Json
          if (-not $warmupResult.success) { throw "Python backend warmup returned an invalid response." }

          # GitHub-hosted runners do not include desktop Microsoft Word.
          # Ver.2.0.0 template inspection and generation use Word COM at runtime,
          # so CI validates runner-independent backend functions here.
          $dataPath = (Resolve-Path "test-data/テスト用置換データ.xlsx").Path
          $inspectRequest = @{
            data_path = $dataPath
            format_amount_with_comma = $true
            amount_include_keywords = @("交付申請額", "交付決定額", "申請額", "金額", "費用", "参加費用", "支援金")
            exclude_example_rows = $true
            row_exclude_mode = "none"
            row_exclude_columns = @()
          } | ConvertTo-Json -Depth 4 -Compress
          $inspectOutput = $inspectRequest | & "src-tauri/resources/backend/word-batch-backend.exe" inspect
          if ($LASTEXITCODE -ne 0) { throw "Python backend data inspection failed." }
          $inspectResult = $inspectOutput | ConvertFrom-Json
          if ($inspectResult.included_count -lt 1) { throw "Data inspection returned no usable rows." }
          if (-not $inspectResult.exclusion_summary) { throw "Exclusion summary was not returned." }

      - name: Test placeholder replacement without Word COM
        shell: pwsh
        run: |
          # This test verifies per-script font attributes and both placeholder syntaxes.
          # Microsoft Word itself is required only on the end-user PC.
          @'
          import os
          import sys
          import tempfile
          from docx import Document
          from docx.oxml.ns import qn

          sys.path.insert(0, os.path.abspath("python"))
          import core

          profiles = {
              "row:学校名": [{
                  "ascii": "Arial",
                  "hAnsi": "Arial",
                  "eastAsia": "ＭＳ 明朝",
                  "cs": "Arial",
              }],
              "common:通知日": [{
                  "ascii": "Times New Roman",
                  "hAnsi": "Times New Roman",
                  "eastAsia": "游明朝",
                  "cs": "Times New Roman",
              }],
          }
          core.set_word_effective_font_profiles(profiles)

          doc = Document()
          doc.add_paragraph("学校：{{学校名}}")
          doc.add_paragraph("日付：<<通知日>>")
          core.replace_placeholders(
              doc,
              {"学校名": "あいうえお高等学校"},
              {"通知日": "令和8年9月16日"},
          )

          with tempfile.TemporaryDirectory() as tmp:
              path = os.path.join(tmp, "replacement-test.docx")
              doc.save(path)
              check = Document(path)
              joined = "\n".join(p.text for p in check.paragraphs)
              if "{{" in joined or "<<" in joined:
                  raise SystemExit("An unreplaced placeholder remains.")

              expected = {
                  "あいうえお高等学校": ("Arial", "ＭＳ 明朝"),
                  "令和8年9月16日": ("Times New Roman", "游明朝"),
              }
              found = set()
              for paragraph in check.paragraphs:
                  for run in paragraph.runs:
                      for value, (ascii_font, east_asia_font) in expected.items():
                          if run.text == value:
                              fonts = run._element.get_or_add_rPr().rFonts
                              if fonts.get(qn("w:ascii")) != ascii_font:
                                  raise SystemExit(f"Unexpected ASCII font for {value}")
                              if fonts.get(qn("w:eastAsia")) != east_asia_font:
                                  raise SystemExit(f"Unexpected East Asian font for {value}")
                              found.add(value)
              if found != set(expected):
                  raise SystemExit(f"Missing replacement runs: {set(expected) - found}")
          '@ | python -
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon set
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.png")) {
            throw "src-tauri/icons/icon.png was not found."
          }
          Copy-Item "src-tauri/icons/icon.png" "app-icon-source.png" -Force
          npm run tauri icon app-icon-source.png
          Remove-Item "app-icon-source.png" -Force
      - name: Verify Windows icon set
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/icons/icon.ico",
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Generated icon is missing: $item" }
          }
      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: WordBatchTool-Windows-v2.0.0
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
