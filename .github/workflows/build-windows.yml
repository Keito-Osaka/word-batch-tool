name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Build Python backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          Push-Location python
          python -m PyInstaller --clean --noconfirm bridge.spec
          Pop-Location
          New-Item -ItemType Directory -Force src-tauri/resources/backend | Out-Null
          Copy-Item python/dist/word-batch-backend/* src-tauri/resources/backend/ -Recurse -Force
      - name: Smoke test Python backend
        shell: pwsh
        run: |
          $warmup = '{}' | & "src-tauri/resources/backend/word-batch-backend.exe" warmup
          if ($LASTEXITCODE -ne 0) { throw "Python backend warmup failed." }
          $warmupResult = $warmup | ConvertFrom-Json
          if (-not $warmupResult.success) { throw "Python backend warmup returned an invalid response." }
          $templateRequest = @{ template_path = (Resolve-Path "test-data/テスト用テンプレート.docx").Path } | ConvertTo-Json -Compress
          $templateWarmup = $templateRequest | & "src-tauri/resources/backend/word-batch-backend.exe" warmup-template
          if ($LASTEXITCODE -ne 0) { throw "Template warmup failed." }
          $templateResult = $templateWarmup | ConvertFrom-Json
          if (-not $templateResult.success) { throw "Template warmup returned an invalid response." }
          $dataPath = (Resolve-Path "test-data/テスト用置換データ.xlsx").Path

          # Ver.1.2.0: no blank-row exclusion, while example rows remain excluded.
          $noneRequest = @{
            data_path = $dataPath
            format_amount_with_comma = $true
            amount_include_keywords = @("交付申請額", "交付決定額", "申請額", "金額", "費用", "参加費用", "支援金")
            exclude_example_rows = $true
            row_exclude_mode = "none"
            row_exclude_columns = @()
          } | ConvertTo-Json -Compress
          $noneOutput = $noneRequest | & "src-tauri/resources/backend/word-batch-backend.exe" inspect
          if ($LASTEXITCODE -ne 0) { throw "No-exclusion smoke test failed." }
          $noneResult = $noneOutput | ConvertFrom-Json
          if ($noneResult.included_count -lt 1) { throw "No-exclusion test returned no usable rows." }
          if (-not $noneResult.exclusion_summary) { throw "Exclusion summary was not returned." }

          # Use the second actual column name so the test remains aligned with the fixture.
          $targetColumn = $noneResult.columns[1]
          if (-not $targetColumn) { throw "Smoke-test data must contain at least two columns." }

          $orRequest = @{
            data_path = $dataPath
            format_amount_with_comma = $true
            exclude_example_rows = $true
            row_exclude_mode = "selected_columns_any_empty"
            row_exclude_columns = @($targetColumn)
          } | ConvertTo-Json -Depth 4 -Compress
          $orOutput = $orRequest | & "src-tauri/resources/backend/word-batch-backend.exe" inspect
          if ($LASTEXITCODE -ne 0) { throw "Selected-column OR smoke test failed." }
          $orResult = $orOutput | ConvertFrom-Json
          if ($orResult.included_count -ne 10) { throw "Unexpected OR included_count: $($orResult.included_count)" }

          $andRequest = @{
            data_path = $dataPath
            format_amount_with_comma = $true
            exclude_example_rows = $true
            row_exclude_mode = "selected_columns_all_empty"
            row_exclude_columns = @($targetColumn)
          } | ConvertTo-Json -Depth 4 -Compress
          $andOutput = $andRequest | & "src-tauri/resources/backend/word-batch-backend.exe" inspect
          if ($LASTEXITCODE -ne 0) { throw "Selected-column AND smoke test failed." }
          $andResult = $andOutput | ConvertFrom-Json
          if ($andResult.included_count -ne 10) { throw "Unexpected AND included_count: $($andResult.included_count)" }

          # Turning example exclusion off must not reduce the included row count.
          $exampleRequest = @{
            data_path = $dataPath
            format_amount_with_comma = $true
            exclude_example_rows = $false
            row_exclude_mode = "none"
            row_exclude_columns = @()
          } | ConvertTo-Json -Compress
          $exampleOutput = $exampleRequest | & "src-tauri/resources/backend/word-batch-backend.exe" inspect
          if ($LASTEXITCODE -ne 0) { throw "Example-row toggle smoke test failed." }
          $exampleResult = $exampleOutput | ConvertFrom-Json
          if ($exampleResult.included_count -lt $noneResult.included_count) { throw "Example-row toggle behaved unexpectedly." }
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install
      - name: Generate Windows icon set
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.png")) {
            throw "src-tauri/icons/icon.png was not found."
          }
          Copy-Item "src-tauri/icons/icon.png" "app-icon-source.png" -Force
          npm run tauri icon app-icon-source.png
          Remove-Item "app-icon-source.png" -Force
      - name: Verify Windows icon set
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/icons/icon.ico",
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png"
          )
          foreach ($item in $required) {
            if (-not (Test-Path $item)) { throw "Generated icon is missing: $item" }
          }
      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: WordBatchTool-Windows-v1.2.1
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
