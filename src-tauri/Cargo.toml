[package]
name = "word-batch-tauri"
version = "1.4.1"
description = "Wordファイル一括作成ツール"
authors = ["Word Batch Tool Project"]
edition = "2021"

[lib]
name = "word_batch_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
